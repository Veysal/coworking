<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css"><title>Брони — Коворкинг</title></head><body>
<div id="nav"></div>
<main><div class="wrap">
  <h1 id="h">Мои брони</h1>
  <p class="muted">Список ограничивает не фронтенд и не бэкенд, а политика Row-Level Security в PostgreSQL.</p>
  <div class="panel"><div class="row">
    <label>Статус<select id="st"><option value="">Все</option><option value="pending">Ожидает</option><option value="confirmed">Подтверждена</option><option value="cancelled">Отменена</option></select></label>
  </div></div>
  <div class="panel scroll" id="list"></div>
</div></main>
<script src="js/app.js"></script>
<script>
if (requireLogin()) {
  renderNav('my');
  const admin = store.user.role === 'admin';
  if (admin) document.getElementById('h').textContent = 'Все брони';
  async function load() {
    try {
      const rows = await api('/bookings', { params: { status: document.getElementById('st').value, limit: 200 } });
      document.getElementById('list').innerHTML = rows.length ? `<table>
        <tr><th>Комната</th>${admin ? '<th>Кто</th>' : ''}<th>Когда</th><th>Название</th><th>Статус</th><th></th></tr>
        ${rows.map(b => `<tr>
          <td>${esc(b.room_name)}<div class="muted">${esc(b.place)}</div></td>
          ${admin ? `<td>${esc(b.user_name)}</td>` : ''}
          <td>${fmtDate(b.start_at)}<div class="muted">${fmtTime(b.start_at)} – ${fmtTime(b.end_at)}</div></td>
          <td>${esc(b.title)}</td>
          <td><span class="badge ${b.status}">${STATUS[b.status]}</span></td>
          <td>${admin && b.status === 'pending' ? `<button class="btn small" data-act="confirm" data-id="${b.id}">Подтвердить</button> ` : ''}
              ${b.status !== 'cancelled' && new Date(b.end_at) > new Date() ? `<button class="btn small danger" data-act="cancel" data-id="${b.id}">Отменить</button>` : ''}</td>
        </tr>`).join('')}</table>` : '<div class="empty">Броней пока нет. Выберите комнату на странице «Комнаты».</div>';
    } catch (e) { toast(e.message, 'err'); }
  }
  document.getElementById('list').addEventListener('click', async e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    try {
      if (b.dataset.act === 'cancel') { if (!confirm('Отменить бронь?')) return; await api('/bookings/' + b.dataset.id, { method: 'DELETE' }); toast('Бронь отменена'); }
      else { await api(`/bookings/${b.dataset.id}/confirm`, { method: 'POST' }); toast('Бронь подтверждена'); }
      load();
    } catch (err) { toast(err.message, 'err'); }
  });
  document.getElementById('st').addEventListener('change', load);
  load();
}
</script></body></html>
